services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "127.0.0.1:9092:29092"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null]
      interval: 10s
      timeout: 10s
      retries: 20

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: cinema
      MINIO_ROOT_PASSWORD: cinema123
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:25.3.3.42
    environment:
      CLICKHOUSE_USER: cinema
      CLICKHOUSE_PASSWORD: cinema123
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./sql:/docker-entrypoint-initdb.d:ro
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'clickhouse-client --user cinema --password cinema123 --query "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16.8
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U airflow]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow:
    build: .
    image: cinema-airflow:local
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
      AIRFLOW__CORE__PARALLELISM: 2
      AIRFLOW__WEBSERVER__WORKERS: 2
      AIRFLOW__WEBSERVER__SECRET_KEY: cinema-local-key
      PYTHONPATH: /opt/airflow/project
      DAG_SCHEDULE: ${DAG_SCHEDULE:-0 0 * * *}
    command: >-
      bash -c 'airflow db migrate && (airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@example.com || true) && (airflow scheduler & exec airflow webserver)'
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data:ro
      - ./dags:/opt/airflow/dags:ro
      - ./scripts:/opt/airflow/project:ro
      - airflow_logs:/opt/airflow/logs
      - work_data:/opt/airflow/work
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_started

  archive:
    image: cinema-airflow:local
    build: .
    command: python /opt/airflow/project/archive.py
    restart: on-failure
    volumes:
      - ./scripts:/opt/airflow/project:ro
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  kafka_data:
  minio_data:
  clickhouse_data:
  postgres_data:
  airflow_logs:
  work_data:
